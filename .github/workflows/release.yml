# Builds installers for every platform.
#
# * Push a tag like `v0.1.0`  -> builds everything and publishes a GitHub pre-release.
# * Run it manually (Actions tab -> "Build installers" -> Run workflow) -> builds
#   everything and attaches the files to the run as downloadable artifacts.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "lethe $GITHUB_REF_NAME (prototype)" --notes "$(cat <<'NOTES'
          ⚠️ **Prototype.** Unaudited cryptography, expect breaking changes. See the README.

          | Platform | File |
          |---|---|
          | Windows | `.exe` (installer) or `.msi` |
          | Linux, any distro (incl. Arch) | `.AppImage`: `chmod +x` it and run |
          | Debian / Ubuntu | `.deb` |
          | Fedora / openSUSE | `.rpm` |
          | macOS (Apple Silicon) | `.dmg` (unsigned: right-click → Open the first time) |
          | Android | `lethe-android.apk` (allow "install unknown apps") |

          You also need a relay that every device can reach: run `lethe-relay` on a server, or on your PC for testing on the same network.
          NOTES
          )"
          echo "id=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          tauriScript: npx -y @tauri-apps/cli@2
          releaseId: ${{ needs.create-release.outputs.release_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: lethe-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg

  android:
    needs: create-release
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The Android SDK and NDK come preinstalled on GitHub's Ubuntu runners.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK=$ANDROID_NDK_LATEST_HOME"
          test -d "$ANDROID_HOME/build-tools" && test -d "$ANDROID_NDK_LATEST_HOME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the Android project
        working-directory: app/src-tauri
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx -y @tauri-apps/cli@2 android init --ci
      - name: Build APK
        working-directory: app/src-tauri
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx -y @tauri-apps/cli@2 android build --apk --ci
      - name: Sign APK
        working-directory: app/src-tauri
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK=$(find gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "built: $APK"
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::warning::No signing key configured, so the APK is unsigned and won't install. Run scripts/setup-android-signing.sh once."
            cp "$APK" "$GITHUB_WORKSPACE/lethe-android-UNSIGNED.apk"
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lethe.jks"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/lethe.jks" --ks-key-alias lethe \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$GITHUB_WORKSPACE/lethe-android.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/lethe-android.apk"
          rm -f "$RUNNER_TEMP/lethe.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: lethe-android
          path: lethe-android*.apk
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/') && hashFiles('lethe-android.apk') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" lethe-android.apk --repo "$GITHUB_REPOSITORY"
