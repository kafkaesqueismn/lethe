[workspace]
resolver = "3"
members = ["crates/proto", "crates/crypto", "crates/client", "crates/relay", "crates/cli"]
# The Tauri app is its own workspace so `cargo test --workspace` doesn't need webkit/GTK.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
lethe-proto = { path = "crates/proto" }
lethe-crypto = { path = "crates/crypto" }
lethe-client = { path = "crates/client" }
lethe-relay = { path = "crates/relay" }

x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
ciborium = "0.2"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
tokio-socks = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
