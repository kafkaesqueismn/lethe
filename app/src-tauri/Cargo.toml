[package]
name = "niche-app"
description = "niche desktop and mobile app"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "niche_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
niche-client = { path = "../../crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
