[package]
name = "lethe-app"
description = "lethe desktop and mobile app"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
name = "lethe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
lethe-client = { path = "../../crates/client" }
lethe-relay = { path = "../../crates/relay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-notification = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
